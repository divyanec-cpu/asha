<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ASHA — placeholder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #12151a;
        color: #f4f1ea;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 2rem;
        line-height: 1.6;
      }
      code { color: #b8863b; }
    </style>
  </head>
  <body>
    <!--
      THIS FILE IS NEVER SERVED in normal operation.

      Capacitor requires a `webDir` even in remote-URL mode, where the WebView
      loads the deployed site instead of any bundled assets. This directory is
      that placeholder.

      If you are reading this text ON A DEVICE, the remote URL failed to load —
      which almost always means ASHA_APP_URL was unset or wrong when the APK was
      built. It is written as a legible message rather than left as an empty
      directory precisely so that failure names itself instead of appearing as a
      blank white screen.
    -->
    <div>
      <p><strong>ASHA could not reach the app.</strong></p>
      <p>
        This placeholder means the native shell was built without a valid
        <code>ASHA_APP_URL</code>, or the device has no connection.
      </p>
    </div>
  </body>
</html>
